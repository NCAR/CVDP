[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "CVDP"
version = "0.1"
authors = [
  { name="Adam Phillips", email="asphilli@ucar.edu" },
  { name="Justin Richling", email="richling@ucar.edu" },
  { name="Cameron Cummins", email="cameron.cummins@utexas.edu" },
]
description = "An automated analysis tool and data repository for assessing modes of climate variability and trends in models and observations."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "netCDF4",
  "cftime",
  "matplotlib",
  "pandas",
  "pyyaml",
  "jinja2",
  "requests",
  "xarray",
  "scipy",
  "cartopy",
  "xskillscore",
  "xesmf",
  "geocat-comp"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://www.cesm.ucar.edu/projects/cvdp"
Issues = "https://github.com/NCAR/CVDP/issues"

[project.scripts]
cvdp = "cvdp.cli:main"

[tool.setuptools.packages.find]
include = ["cvdp*"]

[tool.setuptools.package-data]
cvdp = ["variable_defaults.yaml", "template_*.html", "file_not_found_image.png"]
"cvdp.vis" = ["colormaps/*", "cas_cvdp-le_banner.png", "cvdp.mplstyle"]
"cvdp.cvdp_utils" = ["landsea.nc"]